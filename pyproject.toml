[project]
name = "bo-eval"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pydantic",
    "mujoco",
    "mink",
    "daqp",
    "opencv-python",
    "anthropic>=1.11.0",
]

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.6.0",
    "pytest",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bo_eval", "harness", "lab_sim"]

[tool.uv]

[tool.uv.sources]
